<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>펀드투자권유자문인력 실전 퀴즈 100</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#697386;--line:#e4e8f0;--blue:#315efb;--blue2:#eaf0ff;--green:#16834a;--red:#c0394b;--amber:#a96500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;line-height:1.55}
header{background:linear-gradient(120deg,#18284d,#315efb);color:white;padding:28px 18px 24px}
.wrap{max-width:900px;margin:auto;padding:0 16px}
h1{font-size:25px;margin:0 0 8px}.sub{opacity:.9;font-size:14px}
main{padding:20px 0 48px}.panel,.question,.result{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #17203308}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f7f8fc;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
button,select{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px 13px;background:white;color:var(--ink);cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}
.progress{height:8px;background:#e9edf5;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:var(--blue);transition:width .2s}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:13px}.tag{background:var(--blue2);color:#2949b8;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}
.question h2{font-size:18px;line-height:1.5;margin:15px 0}
.option{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:white}
.option .letter{font-weight:800;color:var(--muted);min-width:22px}.option.selected{border-color:var(--blue);background:var(--blue2)}
.option.correct{border-color:var(--green);background:#effaf3}.option.wrong{border-color:var(--red);background:#fff1f2}
.explain{margin-top:14px;padding:13px;border-radius:12px;background:#f6f8fc;font-size:14px}.explain strong{display:block;margin-bottom:5px}
.nav{display:flex;justify-content:space-between;gap:8px;margin:12px 0}.nav button{flex:1}
.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.result h2{margin-top:0}
.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scorebox{padding:12px;border-radius:12px;background:#f7f8fc;text-align:center}.scorebox b{font-size:22px;display:block}
.reviewitem{border-top:1px solid var(--line);padding:12px 0}.reviewitem:last-child{border-bottom:1px solid var(--line)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
@media(max-width:560px){h1{font-size:21px}.stats{grid-template-columns:repeat(2,1fr)}.panel,.question,.result{padding:14px}.question h2{font-size:16px}.scoregrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><h1>펀드투자권유자문인력 실전 퀴즈 100</h1><div class="sub">2026년 출제 문항 배분 반영 · 4지선다 · 자동채점 · 오답노트</div></div></header>
<main class="wrap">
<section class="panel">
 <div class="stats">
  <div class="stat"><b id="answered">0/100</b><span>응답 문항</span></div>
  <div class="stat"><b id="wrongCount">0</b><span>현재 오답</span></div>
  <div class="stat"><b id="correctCount">-</b><span>현재 정답</span></div>
  <div class="stat"><b id="score">-</b><span>예상 점수</span></div>
 </div>
 <div class="progress"><div class="bar" id="progress"></div></div>
 <div class="toolbar">
  <button class="primary" id="startBtn">학습 시작</button>
  <button id="wrongBtn" disabled>오답만 다시 풀기</button>
  <button id="allBtn" disabled>전체 문제로 돌아가기</button>
  <button id="resetBtn">전체 초기화</button>
 </div>
 <p class="muted">제한시간 없이 학습할 수 있습니다. 답을 선택하면 정답 여부와 해설이 바로 표시되며, 채점 후 오답만 모아 다시 풀 수 있습니다.</p>
</section>
<div id="quiz"></div>
<div class="nav"><button id="prevBtn">← 이전 문제</button><button id="nextBtn" class="primary">다음 문제 →</button></div>
<section class="panel" style="text-align:center">
 <button class="primary" id="submitBtn">시험 제출 및 채점</button>
 <p class="muted">제출 후 과목별 점수, 오답 해설, 오답 재학습 기능을 이용할 수 있습니다.</p>
</section>
<section id="result" class="result hidden"></section>
</main>
<footer>학습용 자체 제작 문제입니다. 공식 기출 원문이 아니며, 법령·세율·세부 한도는 최신 교재 및 시험 공고를 다시 확인하세요.</footer>
<script>
const Q=(subject,area,question,options,answer,explain)=>({subject,area,question,options,answer,explain});
const data=[
Q(1,"법규","집합투자의 개념에 관한 설명으로 가장 적절한 것은?",["투자자 1인의 자산만 운용하는 행위","2인 이상의 투자자로부터 모은 재산을 투자자의 일상적 운용지시 없이 운용하고 그 결과를 배분하는 것","원금과 수익을 보장하는 예금업무","투자자별로 별도 자문만 제공하는 행위"],1,"집합투자는 다수 투자자의 자금을 모아 투자자의 일상적인 운용지시 없이 운용하고 그 결과를 투자자에게 귀속시키는 구조다."),
Q(1,"법규","집합투자업자의 주된 업무는?",["집합투자재산의 운용","집합투자재산의 보관·관리","투자자 예금의 지급보증","세무서의 과세처분"],0,"집합투자업자는 집합투자재산을 운용한다. 신탁업자는 재산의 보관·관리 업무를 담당한다."),
Q(1,"법규","투자신탁에 관한 설명으로 옳은 것은?",["법인격이 있는 회사형 집합투자기구다","수익증권을 발행하는 신탁형 집합투자기구다","주식만 발행한다","반드시 거래소에 상장해야 한다"],1,"투자신탁은 신탁계약에 따라 설정되는 신탁형 집합투자기구이며 수익증권을 발행한다."),
Q(1,"법규","투자회사에 관한 설명으로 옳은 것은?",["법인격이 없는 신탁형 기구다","회사 형태의 집합투자기구다","수익증권만 발행할 수 있다","신탁업자가 투자회사의 운용을 직접 수행한다"],1,"투자회사는 회사 형태의 집합투자기구다. 투자신탁과 법적 구조가 다르다."),
Q(1,"법규","신탁업자의 주요 업무로 가장 적절한 것은?",["투자전략 결정 및 운용","집합투자재산의 보관·관리 및 감시","투자자별 수익률 보장","펀드 광고 제작만 수행"],1,"신탁업자는 집합투자재산을 보관·관리하고 법령과 신탁계약 등에 따른 운용행위를 감시한다."),
Q(1,"법규","개방형 집합투자기구의 일반적 특징은?",["환매가 허용되지 않는다","투자자의 환매청구가 가능한 구조다","추가설정이 절대 불가능하다","반드시 거래소에 상장된다"],1,"개방형은 환매가 가능한 구조다. 다만 환매연기 등 법령상 예외가 있을 수 있다."),
Q(1,"법규","공모펀드에 대한 설명으로 가장 적절한 것은?",["법령상 사모 방식으로만 자금을 모집한다","일반투자자를 포함한 다수 투자자를 대상으로 모집할 수 있다","기관투자자만 투자할 수 있다","원금이 보장된다"],1,"공모는 사모와 달리 법령이 정한 공모 방식으로 투자자를 모집하는 펀드다. 원금보장 여부와는 별개다."),
Q(1,"법규","다음 중 금융상품 판매 과정의 투자자 보호 원칙이 아닌 것은?",["적합성 원칙","적정성 원칙","설명의무","수익률 보장 의무"],3,"금융상품 판매자는 법령에 따른 판매원칙을 준수해야 하지만 수익률을 보장할 의무는 없다."),
Q(1,"법규","적합성 원칙의 취지로 가장 적절한 것은?",["모든 투자자에게 동일한 상품을 권유한다","투자자의 투자목적·재산상황·투자경험 등을 고려해 적합한 상품을 권유한다","수익률이 가장 높은 상품을 우선 권유한다","투자자의 위험감수성향은 고려하지 않는다"],1,"적합성 원칙은 투자자의 정보와 상품의 위험·특성을 고려해 부적합한 권유를 방지하기 위한 원칙이다."),
Q(1,"법규","적정성 원칙에 관한 설명으로 옳은 것은?",["투자권유가 없는 거래에서는 관련이 없다","투자권유 없이 투자자가 거래하려는 경우에도 법령상 대상 상품이면 투자자에게 부적정성을 고지해야 할 수 있다","모든 상품에 예외 없이 동일하게 적용된다","투자손실을 판매회사가 보상하는 원칙이다"],1,"적정성 원칙은 투자권유 없이 거래하는 경우에도 법령상 대상 상품에 대해 투자자의 이해·경험 등에 비추어 부적정하면 그 사실을 알리도록 하는 제도다."),
Q(1,"법규","금융상품 설명의무에 관한 설명으로 옳은 것은?",["상품의 장점만 설명하면 된다","상품의 주요 내용과 위험, 수수료 등 중요사항을 이해할 수 있게 설명해야 한다","투자자가 요청한 경우에만 위험을 설명한다","손실 가능성은 설명 대상이 아니다"],1,"설명의무는 투자자가 합리적인 판단을 할 수 있도록 상품의 중요사항과 위험 등을 설명하는 의무다."),
Q(1,"법규","다음 중 부당권유에 해당할 가능성이 가장 큰 행위는?",["투자위험을 구체적으로 설명하는 행위","투자자의 투자목적을 확인하는 행위","원금손실 가능성이 있는 상품을 원금보장 상품이라고 거짓 설명하는 행위","환매조건과 수수료를 안내하는 행위"],2,"원금손실 가능성이 있는 상품을 원금보장이라고 허위로 설명하는 것은 투자자를 오인시키는 부당한 권유다."),
Q(1,"법규","펀드 판매 시 가장 적절한 절차는?",["수익률만 제시하고 즉시 가입을 유도한다","투자자 정보를 확인하고 상품의 위험·비용·환매조건을 설명한다","모든 고객에게 고위험 상품을 권유한다","투자설명서 교부를 임의로 생략한다"],1,"투자자 정보 확인, 적합성 판단, 중요사항 설명 및 관련 서류 제공 등 법정 절차를 지켜야 한다."),
Q(1,"직무윤리","금융투자업 종사자의 직무윤리로 가장 적절한 것은?",["고객 이익보다 자신의 이익을 우선한다","선량한 관리자의 주의로 고객의 이익을 고려한다","고객정보를 사적으로 활용한다","이해상충을 고의로 은폐한다"],1,"금융투자업 종사자는 법령과 내부통제 기준을 준수하고 고객의 이익을 고려해 성실히 업무를 수행해야 한다."),
Q(1,"직무윤리","미공개중요정보 이용행위에 해당할 가능성이 가장 큰 것은?",["공시된 사업보고서를 분석해 투자한다","공개되지 않은 중요정보를 이용해 해당 증권을 매매한다","신문에 공개된 정보를 활용한다","공개된 시장지표를 비교한다"],1,"미공개중요정보를 이용한 매매는 자본시장법상 금지되는 불공정거래에 해당할 수 있다."),
Q(1,"직무윤리","이해상충을 방지하기 위한 조치로 적절한 것은?",["이해상충 가능성을 고객에게 숨긴다","이해상충 관리체계와 정보교류 차단 등 통제절차를 마련한다","고객정보를 모든 부서에 무제한 공유한다","직원의 사적 이익을 우선한다"],1,"이해상충을 식별·평가하고 필요한 경우 정보교류 차단, 내부통제 및 고객고지 등 적절한 조치를 해야 한다."),
Q(1,"직무윤리","고객 개인정보 처리에 관한 설명으로 옳은 것은?",["업무 목적과 무관하게 자유롭게 이용할 수 있다","법적 근거와 동의 범위, 처리 목적에 맞게 관리해야 한다","모든 임직원이 제한 없이 열람할 수 있다","퇴직 후 개인 영업에 활용할 수 있다"],1,"개인정보는 법적 근거와 처리 목적에 따라 최소한으로 처리하고 안전하게 관리해야 한다."),
Q(1,"직무윤리","투자자의 투자성향을 파악하는 주된 이유는?",["판매직원의 실적을 높이기 위해","투자목적과 위험감수능력 등에 맞는 상품을 권유하기 위해","손실 가능성을 없애기 위해","판매수수료를 높이기 위해"],1,"투자자 정보는 적합성 판단과 투자자 보호를 위한 핵심 자료다."),
Q(1,"직무윤리","투자손실 보전 약속에 관한 설명으로 가장 적절한 것은?",["모든 경우 자유롭게 허용된다","법령상 예외를 제외하고 손실보전 또는 이익보장 약속은 제한된다","구두 약속이면 항상 허용된다","우수고객에게는 무조건 허용된다"],1,"금융투자상품의 손익은 투자자에게 귀속되는 것이 원칙이며 손실보전·이익보장 약속은 법령상 예외 외에는 금지된다."),

Q(1,"펀드운용","분산투자 효과가 커질 가능성이 높은 포트폴리오의 특성은?",["편입자산 간 상관관계가 낮다","모든 자산의 수익률이 완전히 같은 방향으로 움직인다","한 종목에 집중한다","모든 자산이 동일 기업의 주식이다"],0,"자산 간 상관관계가 낮을수록 수익률 변동이 상쇄되어 포트폴리오 위험을 줄일 여지가 커진다."),
Q(1,"펀드운용","포트폴리오 리밸런싱의 의미로 옳은 것은?",["목표 자산배분 비중에서 벗어난 포트폴리오를 목표 비중으로 조정하는 것","펀드의 원금을 보장하는 것","기준가격을 고정하는 것","수수료를 환급하는 것"],0,"리밸런싱은 시장변동으로 달라진 자산비중을 투자정책상의 목표 비중으로 되돌리는 과정이다."),
Q(1,"펀드운용","액티브 운용과 패시브 운용의 차이에 관한 설명으로 옳은 것은?",["액티브는 초과성과를 추구하고 패시브는 기준지수 추종을 지향한다","패시브는 반드시 파생상품만 사용한다","액티브는 위험이 없다","두 방식은 항상 같은 수익률을 낸다"],0,"액티브는 운용자의 판단을 활용해 초과성과를 추구하고, 패시브는 지수 등 기준을 추종하는 방식이다."),

Q(1,"펀드평가","베타가 1보다 큰 펀드의 일반적인 특징은?",["시장수익률 변화에 대한 민감도가 시장보다 크다","시장보다 변동성이 반드시 낮다","시장과 반대로만 움직인다","무위험자산이다"],0,"베타는 시장수익률 변화에 대한 민감도다. 1보다 크면 시장 움직임에 더 민감한 경향이 있다."),

Q(2,"파생법규","파생상품을 활용하는 펀드의 투자설명에서 특히 중요한 사항은?",["파생상품 구조와 레버리지·손실 가능성","수익률만","원금보장 여부를 생략한 설명","판매직원의 실적"],0,"파생상품은 구조가 복잡하고 레버리지로 손실이 확대될 수 있어 손익구조와 주요 위험을 구체적으로 설명해야 한다."),
Q(2,"파생법규","파생상품펀드 판매 시 투자자 보호를 위해 가장 적절한 것은?",["투자자의 경험과 위험감수능력을 확인하고 상품의 구조·위험을 설명한다","모든 투자자에게 동일하게 권유한다","최대수익만 설명한다","손실 가능성을 숨긴다"],0,"고위험·복잡한 상품일수록 투자자 정보 확인과 이해 가능한 설명이 중요하다."),
Q(2,"파생법규","파생상품 관련 투자권유에서 부적절한 행위는?",["손실 시나리오를 안내한다","기초자산과 만기조건을 설명한다","원금손실 가능성이 있는데 원금보장이라고 단정한다","중도환매 제한을 설명한다"],2,"손실 가능성이 있는 상품을 원금보장이라고 단정하는 것은 허위·오인 설명에 해당할 수 있다."),
Q(2,"파생법규","파생상품펀드의 위험고지에 포함될 사항으로 가장 적절한 것은?",["기초자산 변동에 따른 손실 가능성과 레버리지 위험","과거 수익률만","판매회사 주소만","운용직원 이름만"],0,"파생상품의 손익은 기초자산·변동성·금리·만기 등에 민감하고 레버리지로 손실이 커질 수 있다."),
Q(2,"파생법규","파생상품 거래상대방 위험이란?",["거래상대방이 계약상 의무를 이행하지 못할 위험","기초자산 가격이 상승하는 위험","투자자의 세금 위험","펀드 기준가격이 고정되는 위험"],0,"장외파생상품 등에서는 거래상대방의 채무불이행으로 약정한 현금흐름을 받지 못할 수 있다."),
Q(2,"파생법규","파생상품펀드의 투자권유 시 손익구조를 설명하는 방법으로 적절한 것은?",["유리한 경우와 불리한 경우의 손익 예시를 함께 제시한다","최대수익만 제시한다","불리한 시나리오는 제외한다","기초자산을 설명하지 않는다"],0,"투자자는 다양한 시장상황에서 손익이 어떻게 달라지는지 이해해야 한다."),
Q(2,"파생법규","장외파생상품을 활용한 펀드에서 특히 유의할 위험은?",["거래상대방 신용위험과 유동성 위험","공실 위험만","임대료 위험만","예금보험 위험"],0,"장외파생상품은 거래상대방의 신용상태와 계약 청산 가능성 등이 중요한 위험요인이다."),
Q(2,"파생영업","선물계약의 일반적인 특징은?",["표준화된 계약이 거래소에서 거래되는 경우가 많다","매수자에게 권리만 있고 의무는 없다","프리미엄만 지급하면 계약이 끝난다","계약 이행의무가 없다"],0,"선물은 거래소에서 거래되는 표준화된 계약이 일반적이며 매수·매도 양측 모두 계약상 의무를 부담한다."),
Q(2,"파생영업","옵션 매수자의 권리와 의무에 관한 설명으로 옳은 것은?",["권리를 보유하고 행사 여부를 선택할 수 있다","반드시 행사해야 한다","프리미엄을 받는다","계약 상대방에게 무조건 손해를 배상한다"],0,"옵션 매수자는 프리미엄을 지급하고 권리를 취득하며 행사 여부를 선택할 수 있다."),
Q(2,"파생영업","콜옵션이 부여하는 권리는?",["기초자산을 매수할 권리","기초자산을 매도할 권리","기초자산을 매수할 의무","기초자산을 매도할 의무"],0,"콜옵션은 정해진 조건으로 기초자산을 매수할 수 있는 권리다."),
Q(2,"파생영업","풋옵션 매수자가 일반적으로 유리한 시장상황은?",["기초자산 가격 하락","기초자산 가격 상승","변동성이 항상 0","만기와 무관하게 가격 고정"],0,"풋옵션은 기초자산을 정해진 가격에 매도할 권리이므로 가격 하락 시 가치가 커질 수 있다."),
Q(2,"파생영업","옵션 매수자의 최대손실은 일반적으로 무엇으로 제한되는가?",["지급한 옵션 프리미엄","기초자산 전체 가치","무제한","행사가격의 두 배"],0,"옵션 매수자는 권리를 행사하지 않을 수 있으므로 최대손실은 지급한 프리미엄과 거래비용 수준이다."),
Q(2,"파생영업","콜옵션 매도자의 손실 가능성에 관한 설명으로 옳은 것은?",["기초자산 가격이 크게 상승하면 이론상 손실이 무제한일 수 있다","최대손실은 받은 프리미엄으로 제한된다","항상 손실이 없다","기초자산 가격과 무관하다"],0,"콜옵션 매도자는 가격 상승 시 의무 이행으로 큰 손실이 발생할 수 있으며 이론상 손실한도가 없다."),
Q(2,"파생영업","선물 매수 포지션에 일반적으로 유리한 상황은?",["기초자산 가격 상승","기초자산 가격 하락","가격과 무관","거래량 감소만"],0,"선물 매수자는 약정가격으로 매수하는 포지션이므로 기초자산 가격 상승 시 이익이 발생한다."),
Q(2,"파생영업","금리스왑의 대표적인 구조는?",["고정금리 현금흐름과 변동금리 현금흐름의 교환","서로 다른 주식의 교환","부동산 소유권의 교환","주식배당과 세금의 교환"],0,"금리스왑은 일반적으로 동일 통화의 명목원금을 기준으로 고정금리와 변동금리 이자현금흐름을 교환한다."),
Q(2,"파생리스크","VaR(Value at Risk)의 의미로 가장 적절한 것은?",["정해진 기간과 신뢰수준에서 예상되는 손실규모의 통계적 추정치","확정된 최대손실액","투자수익률","원금보장 금액"],0,"VaR는 특정 신뢰수준과 보유기간을 전제로 한 손실위험 추정치이며 실제 최대손실을 보장하는 수치는 아니다."),
Q(2,"파생리스크","옵션의 델타(Delta)는 무엇을 나타내는가?",["기초자산 가격 변화에 대한 옵션가격의 민감도","변동성 변화에 대한 민감도","시간 경과에 따른 가치 감소","금리 변화에 대한 민감도"],0,"델타는 기초자산 가격이 변할 때 옵션가격이 얼마나 변하는지를 나타내는 1차 민감도다."),
Q(2,"파생리스크","옵션의 감마(Gamma)는 무엇을 나타내는가?",["델타의 변화율","옵션의 시간가치","무위험이자율","신용등급"],0,"감마는 기초자산 가격 변화에 따른 델타의 변화 정도를 나타낸다."),
Q(2,"파생리스크","옵션의 베가(Vega)는 무엇을 나타내는가?",["변동성 변화에 대한 옵션가격의 민감도","금리 변화에 대한 민감도","기초자산 가격 변화에 대한 민감도","시간 경과에 대한 민감도"],0,"베가는 기초자산의 변동성 변화에 대한 옵션가격의 민감도다."),
Q(2,"파생리스크","옵션의 세타(Theta)는 무엇을 나타내는가?",["시간 경과에 따른 옵션가격 변화","금리 변화","변동성 변화","환율 변화"],0,"세타는 시간의 경과에 따른 옵션가치의 변화를 나타내며 다른 조건이 같다면 매수 옵션의 시간가치는 감소하는 경향이 있다."),
Q(2,"파생리스크","옵션의 로(Rho)는 무엇을 나타내는가?",["금리 변화에 대한 옵션가격의 민감도","주가 변화에 대한 민감도","시간 경과","거래량 변화"],0,"로는 금리 변화에 대한 옵션가격의 민감도를 나타내는 그릭스 지표다."),
Q(2,"파생리스크","옵션의 내재가치에 관한 설명으로 옳은 것은?",["즉시 행사한다고 가정했을 때 얻을 수 있는 가치","시간가치만을 의미한다","옵션 프리미엄 전체와 항상 같다","거래소 수수료를 의미한다"],0,"내재가치는 즉시 행사 가치이며 옵션 프리미엄은 내재가치와 시간가치 등으로 구성된다."),
Q(2,"파생리스크","옵션의 시간가치에 영향을 주는 요인으로 가장 적절하지 않은 것은?",["잔존만기","기초자산 변동성","기초자산 가격과 행사가격의 관계","판매회사의 영업직원 수"],3,"옵션의 시간가치는 잔존만기, 변동성, 기초자산 가격, 행사가격, 금리 등 시장요인에 영향을 받는다."),

<script>
let answers={},current=0,viewMode="all",visible=[...Array(data.length).keys()],submitted=false,wrongPool=[];
const $=id=>document.getElementById(id);
const letters=["①","②","③","④"];
function qIndex(){return visible[current]}
function wrongIndices(){return data.map((q,i)=>i).filter(i=>answers[i]!==undefined&&answers[i]!==data[i].answer)}
function updateStats(){
 const n=visible.filter(i=>answers[i]!==undefined).length;
 const correct=visible.filter(i=>answers[i]===data[i].answer).length;
 $("answered").textContent=n+"/"+visible.length;
 $("wrongCount").textContent=wrongIndices().length;
 $("correctCount").textContent=n?correct:"-";
 $("score").textContent=n?Math.round(correct/visible.length*100)+"점":"-";
 $("progress").style.width=(n/visible.length*100)+"%";
}
function render(){
 const idx=qIndex(),q=data[idx];
 if(!q){$("quiz").innerHTML='<p class="muted">표시할 문제가 없습니다.</p>';return;}
 $("quiz").innerHTML=`<article class="question"><div class="qtop"><span>${viewMode==="wrong"?"오답 재학습":"문제"} ${current+1} / ${visible.length} · 원래 ${idx+1}번</span><span class="tag">${q.subject}과목 · ${q.area}</span></div><h2>${q.question}</h2><div id="opts">${q.options.map((o,i)=>`<button class="option ${answers[idx]===i?'selected':''} ${answers[idx]!==undefined&&i===q.answer?'correct':''} ${answers[idx]===i&&answers[idx]!==q.answer?'wrong':''}" data-i="${i}"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join("")}</div>${answers[idx]!==undefined?`<div class="explain"><strong>${answers[idx]===q.answer?"정답입니다.":"오답입니다. 정답은 "+letters[q.answer]+"입니다."}</strong>${q.explain}</div>`:""}</article>`;
 document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{if(submitted)return;answers[idx]=Number(b.dataset.i);render();updateStats();}));
 $("prevBtn").disabled=current===0;$("nextBtn").disabled=current===visible.length-1;
}
function move(delta){current=Math.max(0,Math.min(visible.length-1,current+delta));render()}
$("startBtn").onclick=()=>{$("startBtn").textContent="학습 진행 중";$("startBtn").disabled=true};
$("prevBtn").onclick=()=>move(-1);$("nextBtn").onclick=()=>move(1);
$("resetBtn").onclick=()=>{
 if(!confirm("모든 답안과 오답 기록을 초기화할까요?"))return;
 answers={};current=0;submitted=false;viewMode="all";visible=[...Array(data.length).keys()];
 $("startBtn").textContent="학습 시작";$("startBtn").disabled=false;
 $("wrongBtn").disabled=true;$("allBtn").disabled=true;$("result").classList.add("hidden");$("submitBtn").disabled=false;
 updateStats();render();
};
function submit(){
 if(submitted)return;submitted=true;
 const right=[0,0,0],totals=[60,25,15];
 data.forEach((q,i)=>{if(answers[i]===q.answer)right[q.subject-1]++;});
 const total=right.reduce((a,b)=>a+b,0),pass=total>=70&&right[0]>=30&&right[1]>=13&&right[2]>=8;
 wrongPool=wrongIndices();
 $("result").classList.remove("hidden");
 $("result").innerHTML=`<h2>채점 결과: ${total} / 100점</h2><p><strong style="color:${pass?'var(--green)':'var(--red)'}">${pass?'합격 기준 충족':'합격 기준 미충족'}</strong> · 총점 70점 이상 및 과목별 50% 이상 기준</p><div class="scoregrid">${["펀드일반","파생상품펀드","부동산펀드"].map((n,i)=>`<div class="scorebox"><b>${right[i]}/${totals[i]}</b>${n}<div class="muted">${right[i]>=Math.ceil(totals[i]/2)?"과락 통과":"과락"}</div></div>`).join("")}</div><h3>오답 및 미응답 해설 (${wrongPool.length}개 오답 · ${data.filter((q,i)=>answers[i]===undefined).length}개 미응답)</h3>${data.map((q,i)=>answers[i]===q.answer?"":`<div class="reviewitem"><b>${i+1}번 · ${q.area}</b><p>${q.question}</p><p>내 답: ${answers[i]===undefined?"미응답":letters[answers[i]]} / 정답: ${letters[q.answer]}</p><div class="muted">${q.explain}</div></div>`).join("")||"<p>모든 문제를 맞혔습니다!</p>"}`;
 $("wrongBtn").disabled=wrongPool.length===0;$("allBtn").disabled=false;$("submitBtn").disabled=true;
 $("result").scrollIntoView({behavior:"smooth"});
}
$("submitBtn").onclick=()=>{if(confirm("답안을 제출하고 채점할까요? 제출 후 답안 수정은 오답 재학습 또는 전체 초기화로 진행할 수 있습니다."))submit()};
$("wrongBtn").onclick=()=>{
 if(!wrongPool.length)return;
 visible=[...wrongPool];current=0;viewMode="wrong";submitted=false;
 visible.forEach(i=>delete answers[i]);
 $("result").classList.add("hidden");$("submitBtn").disabled=false;$("wrongBtn").disabled=true;
 updateStats();render();$("quiz").scrollIntoView({behavior:"smooth"});
};
$("allBtn").onclick=()=>{
 visible=[...Array(data.length).keys()];current=0;viewMode="all";submitted=false;
 $("result").classList.add("hidden");$("submitBtn").disabled=false;
 $("wrongBtn").disabled=wrongIndices().length===0;
 updateStats();render();$("quiz").scrollIntoView({behavior:"smooth"});
};
updateStats();render();
</script>
